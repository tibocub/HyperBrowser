# The official site on GitHub Pages (spec 005): `hypermd build sites/home`, the same pages HyperBrowser serves.
# Turn it on once in the repo's Settings → Pages → Source: "GitHub Actions".
name: Official site
on:
  push:
    branches: [main]
    paths: ['sites/home/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tibocub/HyperMD
          path: .hypermd
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
        working-directory: .hypermd
      - id: pages
        uses: actions/configure-pages@v5
      - run: node .hypermd/bin/hypermd.js build sites/home --out _site --url "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
