<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
<title>HyperBrowser</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div id="bars">
  <header id="top">
    <button id="hb" class="btn" aria-haspopup="menu" aria-expanded="false"><span class="g" data-g="hb"></span>HyperBrowser ▾</button>
    <nav id="tabs" aria-label="Open tabs"></nav>
    <button id="plus" class="btn" aria-label="Open a site" title="Open a site (Ctrl+T)"><span class="g g10" data-g="plus"></span></button>
    <div id="drag"></div>
    <div id="win" role="group" aria-label="Window">
      <button id="w-min" class="wb" aria-label="Minimize"><span class="g g10" data-g="min"></span></button>
      <button id="w-max" class="wb" aria-label="Maximize"><span class="g g10" data-g="max"></span></button>
      <button id="w-close" class="wb" aria-label="Close HyperBrowser"><span class="g g10" data-g="close"></span></button>
    </div>
  </header>
  <div id="toolbar" role="toolbar">
    <button id="back" class="tool" aria-label="Back" title="Back (Alt+Left)"><span class="g" data-g="back"></span></button>
    <button id="forward" class="tool" aria-label="Forward" title="Forward (Alt+Right)"><span class="g" data-g="forward"></span></button>
    <button id="reload" class="tool" aria-label="Reload" title="Reload (F5)"><span class="g" data-g="reload"></span></button>
    <label for="address" class="hidden">Address</label>
    <input id="address" spellcheck="false" autocomplete="off" placeholder="Paste a site key (Ctrl+L)">
    <button id="star" class="tool" aria-label="Bookmark" aria-pressed="false"><span class="g" data-g="mark"></span></button>
    <button id="bell" class="tool" aria-label="Notifications" aria-haspopup="menu" aria-expanded="false" title="Notifications"><span id="bell-n">0</span></button>
    <span id="state" aria-live="polite"></span>
  </div>
</div>

<main id="desktop" aria-label="Desktop">
  <ul id="grid"></ul>
</main>

<section id="panel" class="window" hidden>
  <div class="title"><span id="panel-title"></span></div>
  <div class="body">
    <p id="panel-text"></p>
    <div class="row" id="panel-actions">
      <button id="panel-retry" class="push">Try again</button>
      <button id="panel-close" class="push">Close tab</button>
    </div>
  </div>
</section>

<section id="devices" class="window" role="dialog" aria-labelledby="dv-title" hidden>
  <div class="title"><span id="dv-title">Devices</span></div>
  <div class="body">
    <p id="dv-note" class="note" hidden></p>
    <div class="head">Your devices</div>
    <ul id="dv-list"></ul>
    <div id="dv-pass-row" class="field" hidden><label for="dv-pass">Password</label><input id="dv-pass" type="password" autocomplete="off"></div>
    <div class="row left">
      <button id="dv-add" class="push">Add a device</button>
      <button id="dv-join" class="push">Join with a code</button>
      <button id="dv-phrase" class="push">Recovery phrase</button>
    </div>
    <div id="dv-out"></div>
    <div class="row"><button id="dv-close" class="push">Close</button></div>
  </div>
</section>

<section id="config" class="window" role="dialog" aria-labelledby="cf-title" hidden>
  <div class="title"><span id="cf-title">Configuration</span></div>
  <div class="body">
    <div class="head">Notifications</div>
    <div id="cf-apps"></div>
    <div class="head">When the window closes</div>
    <div class="choices" role="group" aria-label="When the window closes">
      <button class="choice" data-tray="on" title="Keep hosting your sites from the tray">Stay in the tray</button><button class="choice" data-tray="off">Quit</button>
    </div>
    <div class="head">Devices</div>
    <div class="row left"><button id="cf-devices" class="push">Your devices…</button></div>
    <div class="row"><button id="cf-close" class="push">Close</button></div>
  </div>
</section>

<div id="backdrop" hidden></div>
<div id="notes" role="menu" aria-label="Notifications" hidden>
  <div class="head">Notifications</div>
  <div id="notes-list"></div>
</div>
<div id="menu" role="menu" aria-label="HyperBrowser" hidden>
  <div class="who"><span class="g" data-g="me"></span><strong>You</strong><span class="fill"></span><span id="me"></span></div>
  <div class="sep" aria-hidden="true">────────────────────────────────────</div>
  <div class="head">Installed</div>
  <div id="installed"></div>
  <div class="sep" aria-hidden="true">────────────────────────────────────</div>
  <button class="item" role="menuitem" id="m-open">Open a site by key…</button>
  <button class="item" role="menuitem" id="m-config">Configuration…</button>
  <div class="head">Look</div>
  <div class="choices" role="group" aria-label="Theme">
    <button class="choice" data-theme="system">System</button><button class="choice" data-theme="light">Light</button><button class="choice" data-theme="dark">Dark</button>
  </div>
  <div class="choices" role="group" aria-label="Accent">
    <button class="choice swatch" data-accent="#1f4fd1" aria-label="Blue"><i></i></button><button class="choice swatch" data-accent="#c2410c" aria-label="Orange"><i></i></button><button class="choice swatch" data-accent="#0b7a52" aria-label="Green"><i></i></button>
  </div>
  <div class="sep" aria-hidden="true">────────────────────────────────────</div>
  <button class="item" role="menuitem" id="m-update" hidden></button>
  <button class="item" role="menuitem" id="m-about">About HyperBrowser</button>
</div>

<div id="ctx" role="menu" hidden>
  <button class="item" role="menuitem" data-act="open">Open</button>
  <button class="item" role="menuitem" data-act="kind">Install</button>
  <button class="item" role="menuitem" data-act="remove">Remove from the desktop</button>
</div>

<script src="ui.js"></script>
</body>
</html>
